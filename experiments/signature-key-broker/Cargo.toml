# Experimental standalone key-operation broker; never an application dependency.
# PATH: experiments/signature-key-broker/Cargo.toml
# CONSUMED BY: explicitly gated developer Cargo commands in this directory only.
[package]
name = "signature-key-broker-experiment"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

# Intentionally independent of the repository's production workspace/lockfile.
[workspace]
resolver = "2"

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "=3.27.0"
