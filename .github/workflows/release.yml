# Builds the app and publishes it as a GitHub Release when a version tag is
# pushed. The app checks the latest release for updates (src/update.rs).
#
#   1. Set `version` in Cargo.toml, e.g. 0.2.0, and commit.
#   2. git tag v0.2.0 && git push origin main v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The app compares its own version with the tag, so a mismatch would
      # offer the same update forever, or never offer it.
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match version $version in Cargo.toml"
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download pdfium.dll
        shell: pwsh
        run: ./get-pdfium.ps1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # The licences shown under About are compiled into the exe, so they're
      # regenerated from exactly what this build contains.
      - name: Write third-party notices
        shell: pwsh
        run: ./make-notices.ps1

      - name: Build
        run: cargo build --release --bin kinetic-pdf

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" target/release/kinetic-pdf.exe --title "${{ github.ref_name }}" --generate-notes

      # The Microsoft Store package, to upload to Partner Center, once
      # packaging/store-identity.json is filled in. The Store signs it, so it
      # isn't attached to the release; it's kept with the run instead.
      - name: Build the Store package
        shell: pwsh
        run: ./packaging/make-msix.ps1 -IfConfigured

      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: target/msix/*.msix
          if-no-files-found: ignore
