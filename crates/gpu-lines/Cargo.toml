[package]
name = "gpu-lines"
version = "0.1.0"
edition = "2021"
description = "Draws a PDF page's annotations on the GPU from their content streams, as a test of whether that beats pdfium for dense drawings."
publish = false

[dependencies]
# Reading content streams, references and layers, shared with the app.
pdf-content = { path = "../pdf-content" }
# The OpenGL bindings eframe's glow backend uses, so the renderer draws inside
# an egui paint callback.
glow = "0.17"
bytemuck = "1.25"
# Turns filled paths into triangles, with either fill rule. Pure Rust.
lyon_tessellation = "1.0"
# Glyph outlines from the TrueType and OpenType fonts embedded in PDFs: Google
# Fonts' Fontations, which Chrome reads web fonts with. Pure Rust.
skrifa = "0.47"
# Glyph outlines from the bare CFF and Type 1 fonts PDFs embed, which skrifa
# doesn't read. Pure Rust.
hayro-font = "0.4"
# Decoding JPEG images. Pure Rust.
zune-jpeg = "0.5"

[dev-dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
# For the viewer: binding pdfium to draw the page and compare against, and
# making the copy the app draws from.
pdf-annotate = { path = "../.." }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# For the viewer's benchmark screenshots.
png = "0.18"
# The small PDFs the tests read.
pdf-content = { path = "../pdf-content", features = ["fixtures"] }
