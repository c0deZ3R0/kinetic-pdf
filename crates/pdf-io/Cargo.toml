[package]
name = "pdf-io"
version = "0.1.0"
edition = "2021"
description = "Measurement markups and scales to and from PDF: ISO 32000 measurement structures plus a /KPDF dictionary, appended as incremental updates."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
markup-model = { path = "../markup-model" }
# lopdf, through the crate the app already shares it with.
pdf-content = { path = "../pdf-content" }
# Text boxes set in the fonts installed here, the way the app sets them.
text-layout = { path = "../text-layout" }
# A text box's words and formats, kept in /KPDF as they were typed.
serde_json = "1.0"

[dev-dependencies]
pdf-content = { path = "../pdf-content", features = ["fixtures"] }
# Draws a text box's appearance back, to see its glyphs are all there.
gpu-lines = { path = "../gpu-lines" }
